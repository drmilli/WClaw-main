services:
  # Cron runner — executes scan/settle/status on schedule
  weatherclaw-cron:
    build: .
    image: weatherclaw:latest
    container_name: weatherclaw-cron
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /root/weatherclaw/data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Web dashboard — reads from shared SQLite, serves at port 3456
  weatherclaw-web:
    build: .
    image: weatherclaw:latest
    container_name: weatherclaw-web
    restart: unless-stopped
    env_file:
      - .env
    command: ["bun", "run", "src/commands/web.ts"]
    volumes:
      - /root/weatherclaw/data:/app/data
    depends_on:
      - weatherclaw-cron
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx — serves landing.html on port 80, proxies /dashboard + /api/ to Bun
  nginx:
    image: nginx:alpine
    container_name: weatherclaw-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./landing.html:/usr/share/nginx/html/landing.html:ro
    depends_on:
      - weatherclaw-web
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

