server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Landing page at /
    location = / {
        try_files /landing.html =404;
    }

    # Static files (logo, images, etc.)
    location / {
        try_files $uri =404;
    }

    # Bot dashboard + API proxied to Bun server
    location /dashboard {
        proxy_pass http://weatherclaw-web:3456;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://weatherclaw-web:3456;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
