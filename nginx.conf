server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Landing page at /
    location = / {
        try_files /landing.html =404;
    }

    # Proxy logo to the Bun web service (ensures image even if host file is missing)
    location = /logo.png {
        proxy_pass http://weatherclaw-web:3456/logo.png;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static files (landing HTML, other assets)
    location / {
        try_files $uri =404;
    }

    # Bot dashboard + API proxied to Bun server
    location /dashboard {
        proxy_pass http://weatherclaw-web:3456;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://weatherclaw-web:3456;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
